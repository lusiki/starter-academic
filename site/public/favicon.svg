<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- An "L" that doubles as a plot axis, with a single data point on the accent.
       Colors invert in dark mode so the tile keeps its edge against the browser
       chrome in either theme. -->
  <style>
    .tile { fill: #171717; }
    .axis { stroke: #FAFAFA; }
    .point { fill: #60A5FA; }
    @media (prefers-color-scheme: dark) {
      .tile { fill: #EDEDED; }
      .axis { stroke: #171717; }
      .point { fill: #2563EB; }
    }
  </style>
  <rect class="tile" width="32" height="32" rx="7"/>
  <path class="axis" d="M10 8V22H24" fill="none" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/>
  <circle class="point" cx="21" cy="12" r="3"/>
</svg>
